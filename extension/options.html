<!doctype html>
<html><head><meta charset="utf-8"><title>Conversation Manager</title><style>body{font:14px system-ui;max-width:720px;margin:32px auto;padding:0 20px}label{display:block;margin:16px 0 6px}input{width:100%;padding:8px;box-sizing:border-box}button{margin-top:18px;padding:8px 14px}.row{display:flex;gap:12px;align-items:center}.row input{width:auto}</style></head>
<body>
<h1>ChatGPT Conversation Manager</h1>
<label>Broker WebSocket URL</label><input id="brokerUrl" placeholder="ws://localhost:8787/extension">
<label>Authentication token</label><input id="token" type="password">
<div class="row"><input id="autoArchive" type="checkbox"><label for="autoArchive">Automatically archive open conversations</label></div>
<label>Archive debounce (milliseconds)</label><input id="autoArchiveDelayMs" type="number" min="500" step="500">
<div class="row"><input id="debug" type="checkbox"><label for="debug">Enable debug console logging</label></div>
<button id="save">Save</button> <span id="status"></span>
<script src="options.js"></script>
</body></html>
